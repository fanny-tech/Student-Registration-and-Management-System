<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>List of all student</title>
</head>
<body>
<h2>List of student who can register </h2>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Email</th>
        <th>Age</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="student : ${students}">
        <td th:text="${student.id}">1</td>
        <td th:text="${student.firstName}">John</td>
        <td th:text="${student.lastName}">Doe</td>
        <td th:text="${student.email}">john@example.com</td>
        <td th:text="${student.age}">20</td>
    </tr>
    </tbody>
</table>

<br/>
<a th:href="@{/students/register}">Kwandikisha undi munyeshuri</a>
</body>
</html>
